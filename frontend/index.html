<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경남 생활 변화 AI 비서</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>경남 생활 변화 AI 비서</h1><p>인구·주거·부동산·상권·공매 통합 시계열 분석</p></div><button id="themeBtn" type="button">🌙 다크 모드</button></header>
<main>
<section class="controls card"><label>지역 <select id="regionSelect"></select></label><label>답변 수준 <select id="answerMode"><option value="simple">간단</option><option value="basic" selected>기본</option><option value="detail">상세</option></select></label><button id="refreshBtn" type="button">요약 새로고침</button><button id="liveBtn" type="button">최신 상태 확인</button><button id="sourceStatusBtn" type="button">데이터 소스 상태</button><span id="freshness"></span></section>
<section class="grid"><article class="card chat"><h2>AI 채팅</h2><div id="messages" class="messages" aria-live="polite"></div><form id="chatForm"><input id="chatInput" required placeholder="예: 이 지역 인구와 부동산 흐름 어때?"><button>전송</button></form><div id="loading" hidden>분석 중… Render 무료 서버는 첫 요청이 늦을 수 있습니다.</div></article>
<article class="card"><h2>데이터 요약</h2><div id="summary"></div><div id="comparisonInfo" class="comparison-info"></div><div id="charts"><svg id="chart0" viewBox="0 0 700 260" role="img" aria-label="시계열 비교 그래프"></svg><svg id="chart1" viewBox="0 0 700 260" role="img" aria-label="추가 시계열 비교 그래프" hidden></svg></div><div class="actions"><button id="csvBtn" type="button">CSV 다운로드</button><button id="jsonBtn" type="button">JSON 다운로드</button></div></article></section>
<section class="grid"><article class="card"><h2>데이터 관리(CRUD)</h2><form id="dataForm"><input id="dataDate" type="date" required><input id="dataValue" type="number" step="any" placeholder="value" required><input id="dataMemo" placeholder="memo"><button>추가</button></form><div id="dataList"></div></article><article class="card"><h2>대화 기록</h2><div id="conversationList"></div></article></section>
<section id="sourceStatusCard" class="card" hidden><h2>데이터 소스 상태</h2><p id="readinessSummary"></p><div id="sourceStatusList"></div></section>
<section class="card"><h2>프로젝트 지표 안내</h2><p>Composite Index와 Proxy는 프로젝트 정의 지표이며 공식 통계와 구별합니다. 가격·거래 지표는 표본수가 작을 때 신뢰도 경고를 함께 표시합니다.</p></section>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
