services:
  - type: web
    name: gyeongnam-ai-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANALYSIS_SCOPE_PREFIX
        value: "4812"
      - key: USE_MEMORY_DB
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_REFRESH_TOKEN
        sync: false

