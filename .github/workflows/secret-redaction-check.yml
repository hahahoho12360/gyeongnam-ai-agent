name: Credential redaction regression check
on:
  push:
    branches: [main]
    paths:
      - scripts/collect/redaction.py
      - scripts/collect/data_go_kr.py
      - scripts/pipeline.py
      - scripts/cloud_rollout.py
      - tests/test_secret_redaction.py
      - .github/workflows/secret-redaction-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Verify generated diagnostics before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from scripts.collect.redaction import redact
          key='synthetic'+'-credential+/='+'not-a-real-key'
          original={'last_error':'HTTP 403 https://example.invalid/api?serviceKey='+quote(key,safe='')+'&month=202210'}
          result=redact(original)
          serialized=json.dumps(result,ensure_ascii=False,indent=2)
          assert key not in serialized and quote(key,safe='') not in serialized
          assert '[REDACTED]' in serialized and '403' in serialized and 'month=202210' in serialized
          report={'status':'passed','scope':'synthetic regression only; no real keys or Firebase access','diagnostic':result}
          Path('artifacts/security').mkdir(parents=True,exist_ok=True)
          Path('artifacts/security/redaction-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: credential-redaction-check-${{ github.run_id }}
          path: artifacts/security/
          retention-days: 7
