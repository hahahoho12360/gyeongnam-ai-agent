    uses: ./.github/workflows/changwon-population-month-worker.yml
    with:
      month: "2026-08"
      attempt: retry
    secrets: inherit
  final_population_recalculation:
    name: Verify all periods and population-only ratios
    needs: [month_2025_09, retry_month_2025_09, month_2025_10, retry_month_2025_10, month_2025_11, retry_month_2025_11, month_2025_12, retry_month_2025_12, month_2026_01, retry_month_2026_01, month_2026_02, retry_month_2026_02, month_2026_03, retry_month_2026_03, month_2026_04, retry_month_2026_04, month_2026_05, retry_month_2026_05, month_2026_06, retry_month_2026_06, month_2026_07, retry_month_2026_07, month_2026_08, retry_month_2026_08]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      USE_MEMORY_DB: 'false'
      DEMO_SEED_ON_START: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Recompute verified periods and check actual Firestore values
        run: timeout --kill-after=15s 45m python scripts/population_only_derived.py --final
      - name: Explain verified and remaining months
        if: always()
        run: |
          python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          path=Path('artifacts/population_repair/population_derived_final.json')
          if path.exists():
              result=json.loads(path.read_text())
              text='### Final population-only verification\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n'
          else:
              text='### Final verification incomplete\nNo complete final report exists. Review job errors and rerun after resolving the cause.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changwon-population-final-${{ github.run_id }}
          path: artifacts/population_repair/
          retention-days: 14
