name: Changwon population follow-up and ratios v3.7.5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/changwon-population-followup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: changwon-population-repair
  cancel-in-progress: false
jobs:
  month_2025_09:
    uses: ./.github/workflows/changwon-population-month-worker.yml
    with:
      month: "2025-09"
      attempt: primary
    secrets: inherit
  retry_month_2025_09:
    needs: [month_2025_09]
    if: ${{ always() && needs.month_2025_09.outputs.retryable_provider_failure == 'true' }}
    uses: ./.github/workflows/changwon-population-month-worker.yml
    with:
      month: "2025-09"
      attempt: retry
    secrets: inherit
  month_2025_10:
    needs: [month_2025_09, retry_month_2025_09]
    if: ${{ always() && (needs.month_2025_09.outputs.continue_processing == 'true' || needs.retry_month_2025_09.outputs.continue_processing == 'true') }}
    uses: ./.github/workflows/changwon-population-month-worker.yml
    with:
      month: "2025-10"
      attempt: primary
    secrets: inherit
  retry_month_2025_10:
