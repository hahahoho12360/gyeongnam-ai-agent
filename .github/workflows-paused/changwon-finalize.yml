name: Changwon MVP finalize v3.2

on:
  workflow_dispatch:
    inputs:
      month:
        description: "비교/최종검증 월 (비워두면 창원 최신월 자동)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: changwon-population-repair
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      USE_MEMORY_DB: "false"
      DEMO_SEED_ON_START: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Firebase secrets
        run: |
          python - <<'PY'
          import os,sys
          required=['FIREBASE_SERVICE_ACCOUNT_JSON','FIREBASE_PROJECT_ID']
          missing=[x for x in required if not os.getenv(x,'').strip()]
          if missing:
              print('Missing secrets:', ', '.join(missing)); sys.exit(2)
          print('Firebase secrets: OK')
          PY

      - name: Dry-run scope check
        shell: bash
        run: |
          MONTH=""
          if [ -n "${{ inputs.month }}" ]; then MONTH="--month ${{ inputs.month }}"; fi
          python scripts/finalize_changwon.py $MONTH --dry-run

      - name: Compute Changwon composite indexes and quality report
        shell: bash
        run: |
          MONTH=""
          if [ -n "${{ inputs.month }}" ]; then MONTH="--month ${{ inputs.month }}"; fi
          python scripts/finalize_changwon.py $MONTH

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: changwon-v32-final-${{ github.run_id }}
          path: artifacts/changwon_v32_final_report.json
          if-no-files-found: error
          retention-days: 30

