name: Changwon Samgye original API diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/changwon-samgye-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      USE_MEMORY_DB: 'false'
      DEMO_SEED_ON_START: 'false'
      DEFER_INDEX_RECOMPUTE: 'true'
      POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgPpltnHhStus/selectStdgPpltnHhStus
      AGE_POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgePpltn/selectStdgSexdAgePpltn
      SINGLE_HOUSEHOLD_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgeOneHh/selectStdgSexdAgeOneHh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read-only single and three-month diagnostic
        run: timeout --kill-after=10s 7m python scripts/population_one_month.py --probe-only --month 2024-08 --max-minutes 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samgye-api-diagnostic-${{ github.run_id }}
          path: artifacts/population_repair/
          retention-days: 14
