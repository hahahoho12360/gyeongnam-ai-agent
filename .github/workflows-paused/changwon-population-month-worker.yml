name: Changwon population monthly worker v3.7.6
on:
  workflow_call:
    inputs:
      month:
        required: true
        type: string
      attempt:
        type: string
        default: primary
    secrets:
      DATA_GO_KR_SERVICE_KEY:
        required: true
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: true
      FIREBASE_PROJECT_ID:
        required: false
    outputs:
      continue_processing:
        value: ${{ jobs.month.outputs.continue_processing }}
      retryable_provider_failure:
        value: ${{ jobs.month.outputs.retryable_provider_failure }}
permissions:
  contents: read
jobs:
  month:
    name: ${{ inputs.month }} verified population repair
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      continue_processing: ${{ steps.process.outputs.continue_processing }}
      retryable_provider_failure: ${{ steps.process.outputs.retryable_provider_failure }}
    env:
      PYTHONUNBUFFERED: '1'
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      USE_MEMORY_DB: 'false'
      DEMO_SEED_ON_START: 'false'
      DEFER_INDEX_RECOMPUTE: 'true'
      POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgPpltnHhStus/selectStdgPpltnHhStus
      AGE_POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgePpltn/selectStdgSexdAgePpltn
      SINGLE_HOUSEHOLD_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgeOneHh/selectStdgSexdAgeOneHh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Bounded pause before one fresh-runner recovery attempt
        if: ${{ inputs.attempt == 'retry' }}
        run: |
          sleep 60
          sleep 60
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/population_repair/
          key: changwon-month-v373-${{ inputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}
          restore-keys: changwon-month-v373-${{ inputs.month }}-
      - name: Repair, verify and recalculate population-only fields
        id: process
        env:
          TARGET_MONTH: ${{ inputs.month }}
        run: python scripts/population_followup_step.py --month "$TARGET_MONTH"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: artifacts/population_repair/
          key: changwon-month-v373-${{ inputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changwon-population-${{ inputs.month }}-${{ github.run_id }}-${{ inputs.attempt }}
          path: artifacts/population_repair/
          retention-days: 14
