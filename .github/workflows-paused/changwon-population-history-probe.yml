name: Changwon population history probe v3.7

on:
  push:
    branches: [main]
    paths: [scripts/probe_population_history.py, .github/workflows/changwon-population-history-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changwon-population-history-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgPpltnHhStus/selectStdgPpltnHhStus
      AGE_POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgePpltn/selectStdgSexdAgePpltn
      SINGLE_HOUSEHOLD_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgeOneHh/selectStdgSexdAgeOneHh
      POPULATION_QUERY_JSON: '{"stdgCd":"{bjd_code}","srchFrYm":"{yyyymm}","srchToYm":"{yyyymm}","lv":"7","regSeCd":"1","type":"JSON"}'
      AGE_POPULATION_QUERY_JSON: '{"stdgCd":"{bjd_code}","srchFrYm":"{yyyymm}","srchToYm":"{yyyymm}","lv":"7","regSeCd":"1","type":"JSON"}'
      SINGLE_HOUSEHOLD_QUERY_JSON: '{"stdgCd":"{bjd_code}","srchFrYm":"{yyyymm}","srchToYm":"{yyyymm}","lv":"7","regSeCd":"1","type":"JSON"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify current codes and probe existing API settings
        run: python scripts/probe_population_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changwon-population-history-probe-${{ github.run_id }}
          path: artifacts/population_repair/
          retention-days: 30
