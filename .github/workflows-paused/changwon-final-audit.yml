name: Changwon final data and index audit v1.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/changwon-final-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: changwon-population-repair
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_MEMORY_DB: 'false'
      DEMO_SEED_ON_START: 'false'
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/final_data_audit.py --repair-metadata
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changwon-final-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/final_audit/
          retention-days: 30
