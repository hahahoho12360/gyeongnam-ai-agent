name: Changwon population history repair v3.7.1 final
on:
  workflow_run:
    workflows: ['Changwon population latest repair v3.7']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_policy:
        description: 'totals_first: 시·5개 구 총계 일치 시 결측 경고로 계속 / strict: 개별 결측도 차단'
        type: choice
        options: [totals_first, strict]
        default: totals_first
      continuation_attempt:
        description: '자동 후속 실행 횟수 (직접 실행할 때 0 유지)'
        type: string
        default: '0'
permissions:
  contents: read
  actions: write
concurrency:
  group: changwon-population-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      USE_MEMORY_DB: 'false'
      DEMO_SEED_ON_START: 'false'
      DEFER_INDEX_RECOMPUTE: 'true'
      VALIDATION_POLICY: ${{ inputs.validation_policy || 'totals_first' }}
      POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgPpltnHhStus/selectStdgPpltnHhStus
      AGE_POPULATION_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgePpltn/selectStdgSexdAgePpltn
      SINGLE_HOUSEHOLD_API_URL: https://apis.data.go.kr/1741000/stdgSexdAgeOneHh/selectStdgSexdAgeOneHh
      POPULATION_QUERY_JSON: '{"stdgCd":"{bjd_code}","srchFrYm":"{yyyymm}","srchToYm":"{yyyymm}","lv":"7","regSeCd":"1","type":"JSON"}'
      AGE_POPULATION_QUERY_JSON: '{"stdgCd":"{bjd_code}","srchFrYm":"{yyyymm}","srchToYm":"{yyyymm}","lv":"7","regSeCd":"1","type":"JSON"}'
      SINGLE_HOUSEHOLD_QUERY_JSON: '{"stdgCd":"{bjd_code}","srchFrYm":"{yyyymm}","srchToYm":"{yyyymm}","lv":"7","regSeCd":"1","type":"JSON"}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Restore successful original API captures for resumable preflight
        uses: actions/cache/restore@v4
        with:
          path: artifacts/population_repair/
          key: changwon-population-final-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: changwon-population-final-v1-
      - name: Audit every remaining month before applying verified population repairs
        run: python scripts/repair_population_history.py --max-months 48 --max-minutes 260 --workers 6 --validation-policy "$VALIDATION_POLICY"
      - name: Preserve successful public API captures even if later verification fails
        uses: actions/cache/save@v4
        if: always()
        with:
          path: artifacts/population_repair/
          key: changwon-population-final-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changwon-population-history-${{ github.run_id }}
          path: artifacts/population_repair/
          retention-days: 30
      - name: Explain result and retained missing values
        if: always()
        run: |
          python scripts/summarize_population_history.py
      - name: Continue unfinished successful batches
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION_ATTEMPT: ${{ inputs.continuation_attempt || '0' }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('artifacts/population_repair/history_status.json'))['status'])")
          if [ "$STATUS" = "needs_continue" ]; then
            NEXT=$(python -c "import os; print(int(os.environ['CONTINUATION_ATTEMPT'])+1)")
            if [ "$NEXT" -le 3 ]; then
              gh workflow run changwon-population-history.yml --ref main -f validation_policy="$VALIDATION_POLICY" -f continuation_attempt="$NEXT"
            else
              echo "::warning::시간 제한으로 미처리 월이 남았습니다. 자동 후속 실행 3회에 도달했습니다."
            fi
          elif [ "$STATUS" != "complete" ]; then
            echo "::warning::검증되지 않은 월은 저장하지 않았습니다. 정상 월 처리는 완료했고 Artifacts와 Summary에 남은 문제를 기록했습니다."
          fi
